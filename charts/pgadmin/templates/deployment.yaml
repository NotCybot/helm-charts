---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/servers: {{ toJson .Values.servers | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # image user, the data dir must belong to it
        runAsNonRoot: true
        runAsUser: 5050
        fsGroup: 5050
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgadmin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGADMIN_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: PGADMIN_LISTEN_PORT
              value: "5050"
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := .Values.config }}
            - name: PGADMIN_CONFIG_{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.servers }}
            - name: PGADMIN_SERVER_JSON_FILE
              value: /etc/pgadmin-servers/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
            {{- end }}
            {{- with .Values.oidc }}
            {{- if .enabled }}
            {{- range list "OIDC_CLIENT_ID" "OIDC_CLIENT_SECRET" "OIDC_METADATA_URL" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pgadmin.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            - name: PGADMIN_CONFIG_AUTHENTICATION_SOURCES
              value: "['oauth2', 'internal']"
            - name: PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER
              value: {{ ternary "True" "False" .autoCreateUser | quote }}
            # Kubernetes fills in $(VAR) from the variables above
            - name: PGADMIN_CONFIG_OAUTH2_CONFIG
              value: >-
                [{'OAUTH2_NAME': '{{ .name }}', 'OAUTH2_DISPLAY_NAME': '{{ .displayName }}',
                'OAUTH2_CLIENT_ID': '$(OIDC_CLIENT_ID)', 'OAUTH2_CLIENT_SECRET': '$(OIDC_CLIENT_SECRET)',
                'OAUTH2_SERVER_METADATA_URL': '$(OIDC_METADATA_URL)', 'OAUTH2_SCOPE': '{{ .scope }}',
                'OAUTH2_ICON': '{{ .icon }}', 'OAUTH2_BUTTON_COLOR': '{{ .buttonColor }}',
                'OAUTH2_CHALLENGE_METHOD': 'S256', 'OAUTH2_RESPONSE_TYPE': 'code'}]
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "pgadmin.secretName" . }}
          ports:
            - name: http
              containerPort: 5050
          # first start builds the SQLite config DB
          startupProbe:
            httpGet:
              path: /misc/ping
              port: http
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
          livenessProbe:
            httpGet:
              path: /misc/ping
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            {{- if .Values.servers }}
            - name: servers
              mountPath: /etc/pgadmin-servers
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pgadmin.claimName" . }}
        {{- if .Values.servers }}
        - name: servers
          configMap:
            name: {{ .Release.Name }}-servers
        {{- end }}
