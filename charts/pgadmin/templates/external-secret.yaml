{{- if and .Values.secret.storeName .Values.secret.path }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "pgadmin.secretName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.secret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "pgadmin.secretName" . }}
  dataFrom:
    - extract:
        key: {{ .Values.secret.path }}
{{- end }}
