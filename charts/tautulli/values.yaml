image:
  repository: tautulli/tautulli
  tag: v2.18.2
  pullPolicy: IfNotPresent

# Plain environment variables, e.g. TZ: Europe/Berlin
env: {}

persistence:
  # Use an existing claim instead of creating <release>-config
  existingClaim: ""
  size: 2Gi
  storageClass: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
